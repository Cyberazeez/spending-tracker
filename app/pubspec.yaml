name: spending_tracker
description: "Personal spending tracker (iOS-first)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  intl: ^0.20.3
  local_auth: ^3.0.2
  lucide_icons_flutter: ^4.0.1
  shared_preferences: ^2.5.6
  sign_in_with_apple: ^8.2.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/guide/
  fonts:
    - family: SaudiRiyal
      fonts:
        - asset: assets/fonts/SaudiRiyal-Regular.ttf
        - asset: assets/fonts/SaudiRiyal-Bold.ttf
          weight: 700
