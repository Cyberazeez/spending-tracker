name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        if: hashFiles('package.json') != ''
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run lint --if-present

      - name: Test
        if: hashFiles('package.json') != ''
        run: npm test --if-present

      - name: Build
        if: hashFiles('package.json') != ''
        run: npm run build --if-present

      - name: Set up Python
        if: hashFiles('requirements.txt') != ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python install + tests
        if: hashFiles('requirements.txt') != ''
        run: |
          pip install -r requirements.txt
          if ls tests test_*.py */test_*.py >/dev/null 2>&1; then pip install pytest && pytest; fi

      # --- Spending tracker: Flutter app, Edge Functions, database ---
      - name: Set up Flutter
        if: hashFiles('app/pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Flutter analyze
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: |
          flutter pub get
          flutter analyze

      - name: Flutter test
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: flutter test

      - name: Set up Deno
        if: hashFiles('supabase/functions/deno.json') != ''
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge Functions lint and test
        if: hashFiles('supabase/functions/deno.json') != ''
        working-directory: supabase/functions
        run: |
          deno lint
          deno check ingest/index.ts rotate-token/index.ts categorize-batch/index.ts
          deno test --allow-read

      - name: Database migrations and RLS test
        if: hashFiles('supabase/tests/db/run_local.sh') != ''
        run: bash supabase/tests/db/run_local.sh
