# iOS build and TestFlight delivery (milestone 6).
# Manual trigger only, so it never burns the free macOS minutes (500/month, personal account) by accident.
#
# One-time setup in the Codemagic UI (never commit these values):
#   1. Teams/Personal account > Integrations > App Store Connect: add an API key (issuer id, key id, .p8).
#      Name it "spending_tracker_asc" (or change `integrations.app_store_connect` below).
#   2. Variable group "signing" with one secure variable CERTIFICATE_PRIVATE_KEY (an RSA key made once with ssh-keygen).
#   3. The bundle id below is the one registered in the Apple Developer portal (com.cyberazeez.spendingtracker).

workflows:
  ios-testflight:
    name: iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: spending_tracker_asc
    environment:
      flutter: 3.47.9
      xcode: latest
      cocoapods: default
      groups:
        - signing # Codemagic variable group holding CERTIFICATE_PRIVATE_KEY (secure), never in git
      vars:
        BUNDLE_ID: com.cyberazeez.spendingtracker # registered in the Apple Developer portal
        APP_STORE_APPLE_ID: "6829500984" # numeric App Store Connect app id (Azeez Spending Tracker)
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $FLUTTER_ROOT/.pub-cache
    scripts:
      - name: Get packages
        script: cd app && flutter pub get
      - name: Set up code signing
        script: |
          keychain initialize
          # Creates the distribution certificate and App Store profile through the API key if they do not exist yet,
          # and reuses them afterwards. CERTIFICATE_PRIVATE_KEY comes from the "signing" variable group.
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project app/ios/Runner.xcodeproj
      - name: Build number from TestFlight
        script: |
          cd app
          # The first upload has no build yet, so the lookup can come back empty: start at 1 then.
          # If the lookup fails for another reason, Apple rejects a duplicate number at upload, so it still fails loudly.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          echo "BUILD_NUMBER=$((LATEST + 1))" >> $CM_ENV
      - name: Build IPA
        script: |
          cd app
          flutter build ipa --release --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
