# Settings the Supabase CLI applies on deploy. The project was created through the connector, so
# these are recorded here to stop a CLI deploy from silently reverting them.
project_id = "evepfssanoffnwtqjmyq"

[auth]
# Open sign-up. Email confirmation is ON (checked in the dashboard 2026-11-09; this file said off and was out of date).
# Must match the dashboard (Authentication > Sign In / Providers), or a CLI deploy would switch it back.
# Before the public release: invite codes (see docs/superpowers/specs/2026-11-04-signup-stage-b-design.md).
enable_signup = true
enable_anonymous_sign_ins = false

# Ship review 2026-11-04: 8 characters minimum (the app already asks for 8 on change), and a password change needs a
# recent sign-in. Set the same in the dashboard (Authentication > Sign In / Providers) or this is not applied.
minimum_password_length = 8

[auth.email]
enable_confirmations = true
secure_password_change = true

[functions.ingest]
# The iOS Shortcut cannot send a JWT. The function authenticates the X-Ingest-Token itself.
verify_jwt = false

[functions.widget-summary]
# The widget extension cannot send a JWT. The function authenticates the X-Widget-Token itself (kind 'widget' only).
verify_jwt = false

[functions.rotate-token]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.categorize-batch]
verify_jwt = true

[functions.insights-tips]
verify_jwt = true

[functions.ai-chat]
verify_jwt = true
